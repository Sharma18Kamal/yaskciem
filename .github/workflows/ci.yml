name: YASK-CIEM CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup Node for operations console
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/CloudEntitle.WebConsole/package-lock.json

      - name: Build and test operations console
        working-directory: src/CloudEntitle.WebConsole
        run: |
          npm ci
          npm test
          npm run build

      - name: Restore
        run: dotnet restore CloudEntitle.sln --configfile .nuget/NuGet.Config

      - name: Validate release PowerShell syntax
        shell: pwsh
        run: |
          $scripts = @('scripts/publish-windows.ps1', 'scripts/package-windows-zip.ps1', 'scripts/package-msix.ps1', 'scripts/install-windows-user.ps1', 'scripts/backup-postgres.ps1', 'scripts/test-postgres-restore.ps1', 'scripts/check-postgres-operations.ps1', 'scripts/run-postgres-maintenance.ps1', 'scripts/register-postgres-maintenance-tasks.ps1')
          foreach ($script in $scripts) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $script), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error "$script`: $($_.Message)" }
              exit 1
            }
          }

      - name: Build solution
        run: dotnet build CloudEntitle.sln --configuration Release --no-restore

      - name: Test staging release safeguards offline
        shell: pwsh
        run: |
          .\infra\scripts\Test-StagingInstaller.ps1
          .\infra\scripts\Test-StagingPipeline.ps1

      - name: Run tests
        run: dotnet test CloudEntitle.sln --configuration Release --no-build --no-restore --logger "console;verbosity=normal"

      - name: Package unsigned MSIX for QA
        shell: pwsh
        run: ./scripts/package-msix.ps1 -PackageVersion "0.0.${{ github.run_number }}.${{ github.run_attempt }}" -OutputPath ./artifacts/msix-ci

      - name: Upload unsigned QA package
        uses: actions/upload-artifact@v4
        with:
          name: yask-ciem-msix-qa-${{ github.run_number }}
          path: artifacts/msix-ci/YASK-CIEM-*.msix
          if-no-files-found: error
          retention-days: 7
